name: Petra platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm env:prepare
      - run: pnpm infra:up
      - run: pnpm db:migrate && pnpm db:seed && pnpm test:db
      - run: node scripts/verify-plan-migration.mjs
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm security:built
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: petra-evidence
          path: |
            docs/evidence/
